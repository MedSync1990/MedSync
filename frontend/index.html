<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=circle-1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=circle-1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=circle-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=circle-1" />
    <link rel="shortcut icon" href="/favicon.ico?v=circle-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedSync</title>
    
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
    
    <!-- Base Styles -->
    <style>
      html,body{margin:0;padding:0;}
      body{overscroll-behavior:none;}
      main>:first-child{margin-top:0!important;}
      main>:last-child{margin-bottom:0!important;}
      ::-webkit-scrollbar{display:none;}
      :focus-visible{outline:2px solid #0284C7;outline-offset:2px;}
      #app-topbar{transition:box-shadow 150ms ease;}
      @media (prefers-reduced-motion: reduce){
        *, *::before, *::after{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition-duration:0.001ms!important;scroll-behavior:auto!important;}
        #app-topbar{transition:none;}
      }
    </style>
    
  </head>
  <body class="bg-canvas-bg font-body-md text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
