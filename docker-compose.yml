services:
  db:
    image: postgres:16
    container_name: medsync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-medsync_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medsync_pass}
      POSTGRES_DB: ${DB_NAME:-medsync}
    ports:
      - "5432:5432"
    volumes:
      - medsync-db-data:/var/lib/postgresql/data
      # auto-run schema + seed scripts on first container start, in filename order
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medsync_app} -d ${DB_NAME:-medsync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medsync-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medsync.local
      PGADMIN_DEFAULT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  # Uncomment once /backend has a Dockerfile (see docs/architecture.md for the FastAPI layout)
  # backend:
  #   build: ./backend
  #   container_name: medsync-backend
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgresql+psycopg2://${DB_USER:-medsync_app}:${DB_PASSWORD:-medsync_pass}@db:5432/${DB_NAME:-medsync}
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app

  # Uncomment once /frontend has a Dockerfile
  # frontend:
  #   build: ./frontend
  #   container_name: medsync-frontend
  #   restart: unless-stopped
  #   environment:
  #     VITE_API_BASE_URL: http://localhost:8000/api/v1
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

volumes:
  medsync-db-data: