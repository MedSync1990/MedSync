services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: medsync
      POSTGRES_PASSWORD: medsync_dev
      POSTGRES_DB: medsync
    ports:
      - "5432:5432"         # expose locally so you can connect with psql / DBeaver
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
